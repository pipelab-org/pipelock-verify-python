name: Canonical Contract Drift

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      go_ref:
        description: 'Go branch, tag, or commit SHA to resolve and check'
        required: false
        default: main

permissions:
  contents: read

jobs:
  go-canonical-v1-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install locked CI dependencies
        run: python -m pip install --require-hashes -r requirements/ci.txt

      - name: Check Go canonical v1 signing projection
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PIPELOCK_GO_REF: ${{ github.event.inputs.go_ref || 'main' }}
        run: python scripts/check_go_canonical_contract.py
