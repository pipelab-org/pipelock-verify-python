[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelock-verify"
version = "0.4.1"
description = "Verify Pipelock receipts: ActionReceipt v1 and wrapped EvidenceReceipt v2 chains."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "PipeLab", email = "luckypipe@pipelab.org" },
]
keywords = [
    "pipelock",
    "agent-security",
    "receipt",
    "ed25519",
    "verifier",
    "ai-safety",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cryptography>=48.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "mypy>=1.19.1",
]
release = [
    "build>=1.4.4",
    "twine>=6.2.0",
    "setuptools>=83.0.0",
    "wheel",
]

[project.urls]
Homepage = "https://pipelab.org"
Repository = "https://github.com/pipelab-org/pipelock-verify-python"
"Pipelock (Go reference)" = "https://github.com/pipelab-org/pipelock"
"Receipt Spec" = "https://pipelab.org/learn/action-receipt-spec/"

[project.scripts]
pipelock-verify = "pipelock_verify.__main__:main"

[tool.setuptools]
packages = ["pipelock_verify"]

[tool.setuptools.package-data]
pipelock_verify = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
